<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Sustainability Optimization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #666;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            max-width: 600px;
        }
        h1 {
            color: #333;
        }
        p {
            line-height: 1.6;
            max-width: 100ch;
            margin: 0 auto;
        }
        button {
            background-color: #5ba63d;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #4b8c32;
        }
        .logo {
            margin-top: 20px;
        }
        .image {
            margin: 20px 0;
        }
        .admin {
            background-color: #ffcccc;
            color: #b30000;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Optimization for Sustainability Complete!</h1>
        <p>Access your optimized network: <a href="{{ dashboard_url }}" target="_blank">Meraki Dashboard</a></p>

        <div class="admin">
            <form action="/reset" method="post">
                <input type="hidden" name="network_id" value="{{ network_id }}">
                <input type="hidden" name="serial_numbers" value="{{ serial_numbers }}">
                <button type="submit">ADMIN TOOLS: Reset</button>
            </form>
        </div>
    </div>
</body>
</html>
